<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="Favicon.png" type="image/x-icon" />
  </head>
  <body>
    <h1>Color Palette Generator</h1>
    <p class="description">
      Generate beautiful RGB color palettes with a single click
    </p>
    <br />
    <br />
    <div class="container">
      <div class="box box1"><p id="code1"></p></div>
      <div class="box box2"><p id="code2"></p></div>
      <div class="box box3"><p id="code3"></p></div>
      <div class="box box4"><p id="code4"></p></div>
      <div class="box box5"><p id="code5"></p></div>
    </div>
    <div class="buttons">
      <button class="generate">Generate Palette</button>
      <button class="copy">Copy All</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
